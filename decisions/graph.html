  .glass-dark {
    position: relative;
    border-radius: 1rem;
    background: rgba(15,25,48,0.05);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(3px);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow:
      inset 0 1px 2px 0 rgba(255,255,255,0.25),
      inset 1px 0 2px 0 rgba(255,255,255,0.15),
      inset 0 -1px 2px 0 rgba(0,0,0,0.35),
      inset -1px 0 2px 0 rgba(0,0,0,0.25),
      0 0 20px rgba(255,255,255,0.04),
      0 4px 6px -1px rgba(0,0,0,0.3),
      0 8px 20px -2px rgba(0,0,0,0.1),
      0 0 40px rgba(0,0,0,0.3);
  }
  .glass-dark::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none; z-index: 0;
    mask-image: linear-gradient(to right, black 0%, transparent 8%, transparent 92%, black 100%),
                linear-gradient(to bottom, black 0%, transparent 8%, transparent 92%, black 100%);
    mask-composite: add;
    -webkit-mask-image: linear-gradient(to right, black 0%, transparent 8%, transparent 92%, black 100%),
                        linear-gradient(to bottom, black 0%, transparent 8%, transparent 92%, black 100%);
    -webkit-mask-composite: source-over;
    backdrop-filter: blur(10px) brightness(1.8);
    -webkit-backdrop-filter: blur(10px) brightness(1.8);
  }
  .glass-dark::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none; z-index: 1;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.02) 1%, rgba(255,255,255,0.06) 8%,

<!-- Animated background (throttled to 15fps when sim active) -->
<script>
(function(){
  const cv = document.getElementById('bg-canvas');
  const cx = cv.getContext('2d');
  let W, H;

  const COLORS = [{r:58,g:223,b:250},{r:193,g:128,b:255},{r:155,g:255,b:206}];

  const orbs = [];
  for(let i=0;i<4;i++){
    orbs.push({
      x:Math.random(), y:Math.random(),
      vx:(Math.random()-0.5)*0.0003, vy:(Math.random()-0.5)*0.0003,
      rad:0.18+Math.random()*0.2,
      col:COLORS[i%COLORS.length],
      opacity:0.07+Math.random()*0.05,
    });
  }

  function resize(){
    const dpr=window.devicePixelRatio||1;
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize',resize);

  let lastBg = 0;
  window._bgThrottle = 66; // ms between bg frames (15fps)
  function frame(ts){
    if (ts - lastBg >= window._bgThrottle) {
      lastBg = ts;
      cx.clearRect(0,0,W,H);
      orbs.forEach(o=>{
        o.x+=o.vx; o.y+=o.vy;
        if(o.x<-0.2||o.x>1.2) o.vx*=-1;
        if(o.y<-0.2||o.y>1.2) o.vy*=-1;
        const r=o.rad*Math.max(W,H);
        const g=cx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,r);
        g.addColorStop(0,`rgba(${o.col.r},${o.col.g},${o.col.b},${o.opacity})`);
        g.addColorStop(1,`rgba(${o.col.r},${o.col.g},${o.col.b},0)`);
        cx.fillStyle=g;
        cx.fillRect(o.x*W-r,o.y*H-r,r*2,r*2);
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

const RELATION_COLORS = {
  supersedes: '#c87850',
  related_to: '#9bffce',
  informs: '#3adffa',
  contradicts: '#e05555',
  refines: '#c180ff',
};

const STATUS_COLORS = {
  accepted: '#9bffce',
  proposed: '#3adffa',
  superseded: '#c87850',
  deprecated: '#666',
};

const TAG_PALETTE = [
  '#3adffa', '#c180ff', '#9bffce', '#ffa94d', '#ff7ab8',
  '#4dc9f6', '#a78bfa', '#50c878', '#f67019', '#acc236',
];

const tagColorMap = {};
DATA.tags.forEach((tag, i) => {
  tagColorMap[tag] = TAG_PALETTE[i % TAG_PALETTE.length];
});

function primaryTagColor(node) {
  if (node.tags && node.tags.length > 0) {
    return tagColorMap[node.tags[0]] || '#7a7aff';
  }
  return '#7a7aff';
}

// Connection count for node sizing
const connectionCount = {};
DATA.nodes.forEach(n => connectionCount[n.id] = 0);
DATA.links.forEach(l => {
  const src = typeof l.source === 'object' ? l.source.id : l.source;
  const dst = typeof l.target === 'object' ? l.target.id : l.target;
  connectionCount[src] = (connectionCount[src] || 0) + 1;
  connectionCount[dst] = (connectionCount[dst] || 0) + 1;
});

document.getElementById('node-count').textContent =
  DATA.nodes.length + ' decisions · ' + DATA.links.length + ' connections';

// ── Canvas setup ──
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (window._renderReady) scheduleRender();
}
resizeCanvas();

// ── Transform state (pan/zoom) ──
let transform = { x: W / 2, y: H / 2, k: 1 };

// ── Pre-compute color caches ──
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

const nodeColorCache = {};
DATA.nodes.forEach(n => {
  const hex = primaryTagColor(n);
  nodeColorCache[n.id] = { hex, rgb: hexToRgb(hex) };
});

// Pre-render glow sprites per color (gradient circles on offscreen canvas)
const glowSpriteCache = {};
function getGlowSprite(hex, radius) {
  const key = hex + '|' + radius;
  if (glowSpriteCache[key]) return glowSpriteCache[key];
  const size = (radius + 8) * 2;
  const off = document.createElement('canvas');
  off.width = size * dpr;
  off.height = size * dpr;
  const oc = off.getContext('2d');
  oc.scale(dpr, dpr);
  const cx = size / 2, cy = size / 2;
  const grad = oc.createRadialGradient(cx, cy, 0, cx, cy, radius + 8);
  const rgb = hexToRgb(hex);
  grad.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},0.25)`);
  grad.addColorStop(0.5, `rgba(${rgb.r},${rgb.g},${rgb.b},0.08)`);
  grad.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
  oc.fillStyle = grad;
  oc.fillRect(0, 0, size, size);
  glowSpriteCache[key] = { canvas: off, size };
  return glowSpriteCache[key];
}

// ── Node radius ──
function nodeRadius(d) {
  const count = connectionCount[d.id] || 0;
  return Math.min(2 + count * 1, 200);
}

// ── Build adjacency for fast neighbor lookup ──
const adjacency = {};
DATA.nodes.forEach(n => adjacency[n.id] = []);
DATA.links.forEach(l => {
  const src = typeof l.source === 'object' ? l.source.id : l.source;
  const dst = typeof l.target === 'object' ? l.target.id : l.target;
  adjacency[src].push({ id: dst, relation: l.relation, dir: 'out', link: l });
  adjacency[dst].push({ id: src, relation: l.relation, dir: 'in', link: l });
});

// ── Tag clustering force ──
function tagCluster(alpha) {
  const centroids = {};
  const counts = {};
  DATA.nodes.forEach(d => {
    const tag = (d.tags && d.tags[0]) || '__none__';
    if (!centroids[tag]) { centroids[tag] = { x: 0, y: 0 }; counts[tag] = 0; }
    centroids[tag].x += d.x || 0;
    centroids[tag].y += d.y || 0;
    counts[tag]++;
  });
  for (const tag in centroids) {
    centroids[tag].x /= counts[tag];
    centroids[tag].y /= counts[tag];
  }
  const strength = 0.02 * alpha;
  DATA.nodes.forEach(d => {
    const tag = (d.tags && d.tags[0]) || '__none__';
    const c = centroids[tag];
    d.vx += (c.x - d.x) * strength;
    d.vy += (c.y - d.y) * strength;
  });
}

// ── Force simulation ──
const nodeCount = DATA.nodes.length;
const baseRadius = Math.max(80, Math.sqrt(nodeCount) * 18);
const chargeStr = nodeCount > 500 ? -40 : nodeCount > 100 ? -100 : -200;
const linkDist = nodeCount > 500 ? 25 : nodeCount > 100 ? 45 : 80;

const simulation = d3.forceSimulation(DATA.nodes)
  .force('link', d3.forceLink(DATA.links).id(d => d.id).distance(linkDist).strength(0.4))
  .force('charge', d3.forceManyBody().strength(chargeStr).distanceMax(baseRadius * 1.5))
  .force('center', d3.forceCenter(0, 0).strength(0.1))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 2).strength(0.6))
  .force('tagCluster', tagCluster)
  .alphaDecay(0.025)
  .velocityDecay(0.4);

// ── Simulation settling: stop when cooled ──
let simRunning = true;
simulation.on('tick', () => {
  scheduleRender();
});
simulation.on('end', () => {
  simRunning = false;
  window._bgThrottle = 100; // slow bg further when sim stopped
  scheduleRender();
});

// ── Highlight state ──
let highlightedNode = null;
let highlightedSet = null; // Set of connected node ids

function setHighlight(d) {
  if (!d) {
    highlightedNode = null;
    highlightedSet = null;
    scheduleRender();
    return;
  }
  highlightedNode = d;
  highlightedSet = new Set([d.id]);
  (adjacency[d.id] || []).forEach(n => highlightedSet.add(n.id));
  scheduleRender();
}

// ── Viewport culling helpers ──
function screenToWorld(sx, sy) {
  return {
    x: (sx - transform.x) / transform.k,
    y: (sy - transform.y) / transform.k,
  };
}

function worldToScreen(wx, wy) {
  return {
    x: wx * transform.k + transform.x,
    y: wy * transform.k + transform.y,
  };
}

function getViewBounds(margin) {
  const m = margin || 50;
  const tl = screenToWorld(-m, -m);
  const br = screenToWorld(W + m, H + m);
  return { x0: tl.x, y0: tl.y, x1: br.x, y1: br.y };
}

function inBounds(x, y, bounds) {
  return x >= bounds.x0 && x <= bounds.x1 && y >= bounds.y0 && y <= bounds.y1;
}

// ── Render ──
let renderScheduled = false;
function scheduleRender() {
  if (!renderScheduled) {
    renderScheduled = true;
    requestAnimationFrame(render);
  }
}
window._renderReady = true;

window.addEventListener('resize', () => {
  resizeCanvas();
  simulation.force('center', d3.forceCenter(0, 0));
  simulation.alpha(0.1).restart();
});

// FPS counter
let fpsFrames = 0;
let fpsLast = performance.now();
const fpsEl = document.getElementById('fps-counter');

function render() {
  renderScheduled = false;

  // FPS
  fpsFrames++;
  const now = performance.now();
  if (now - fpsLast >= 1000) {
    fpsEl.textContent = fpsFrames + ' fps';
    fpsFrames = 0;
    fpsLast = now;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  const bounds = getViewBounds(100 / transform.k);
  const isHighlighting = highlightedSet !== null;
  const zoomLevel = transform.k;

  // ── Draw links ──
  ctx.lineWidth = 1 / transform.k;
  DATA.links.forEach(l => {
    const sx = l.source.x, sy = l.source.y;
    const tx = l.target.x, ty = l.target.y;

    // Viewport cull: skip if both endpoints outside view
    if (!inBounds(sx, sy, bounds) && !inBounds(tx, ty, bounds)) return;

    const relColor = RELATION_COLORS[l.relation] || '#444';
    let alpha = 0.25;
    let lw = 1 / transform.k;

    if (isHighlighting) {
      const sid = l.source.id;
      const tid = l.target.id;
      const connected = sid === highlightedNode.id || tid === highlightedNode.id;
      alpha = connected ? 0.7 : 0.15;
      lw = connected ? 2 / transform.k : 1 / transform.k;
    }

    ctx.strokeStyle = relColor;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // Arrow for directional relations
    if (l.relation === 'supersedes' || l.relation === 'informs' || l.relation === 'refines') {
      if (alpha > 0.1) {
        const dx = tx - sx, dy = ty - sy;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len > 0) {
          const ux = dx / len, uy = dy / len;
          const targetR = nodeRadius(l.target);
          const ax = tx - ux * (targetR + 4);
          const ay = ty - uy * (targetR + 4);
          const arrowSize = Math.max(4, 6 / transform.k);
          ctx.fillStyle = relColor;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(ax - ux * arrowSize - uy * arrowSize * 0.5, ay - uy * arrowSize + ux * arrowSize * 0.5);
          ctx.lineTo(ax - ux * arrowSize + uy * arrowSize * 0.5, ay - uy * arrowSize - ux * arrowSize * 0.5);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
  });

  ctx.globalAlpha = 1.0;

  // ── Draw nodes ──
  DATA.nodes.forEach(d => {
    if (!inBounds(d.x, d.y, bounds)) return;

    const r = nodeRadius(d);
    const color = nodeColorCache[d.id];
    let nodeAlpha = 0.85;
    let glowAlpha = 1.0;

    if (isHighlighting) {
      const inSet = highlightedSet.has(d.id);
      nodeAlpha = inSet ? 1.0 : 0.30;
      glowAlpha = inSet ? 1.0 : 0.30;
    }

    ctx.globalAlpha = glowAlpha;

    // Glow: draw pre-rendered gradient sprite
    const sprite = getGlowSprite(color.hex, r);
    const spriteWorldSize = sprite.size / dpr;
    ctx.drawImage(sprite.canvas,
      d.x - spriteWorldSize / 2,
      d.y - spriteWorldSize / 2,
      spriteWorldSize, spriteWorldSize);

    // Main circle
    ctx.globalAlpha = nodeAlpha;
    ctx.fillStyle = color.hex;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Subtle stroke
    ctx.strokeStyle = color.hex;
    ctx.lineWidth = 1.5 / transform.k;
    ctx.globalAlpha = nodeAlpha * 0.4;
    ctx.stroke();
  });

  ctx.globalAlpha = 1.0;

  // ── Draw labels (only when highlighted or zoomed in enough) ──
  if (isHighlighting) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const fontSize = Math.max(9, 11 / transform.k);
    ctx.font = `500 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;

    highlightedSet.forEach(id => {
      const d = DATA.nodes.find(n => n.id === id);
      if (!d || !inBounds(d.x, d.y, bounds)) return;
      const r = nodeRadius(d);

      // Text shadow
      ctx.fillStyle = '#060e20';
      ctx.globalAlpha = 0.9;
      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          ctx.fillText(d.id, d.x + ox / transform.k, d.y + r + 6 / transform.k + oy / transform.k);
        }
      }

      ctx.fillStyle = d.id === highlightedNode.id ? '#ffffff' : '#dee5ff';
      ctx.globalAlpha = 0.9;
      ctx.fillText(d.id, d.x, d.y + r + 6 / transform.k);
    });
  } else if (zoomLevel > 2.0) {
    // Show labels when zoomed in close
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const fontSize = Math.max(8, 10 / transform.k);
    ctx.font = `400 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
    ctx.fillStyle = '#dee5ff';
    ctx.globalAlpha = Math.min(1, (zoomLevel - 2.0) * 0.8);

    DATA.nodes.forEach(d => {
      if (!inBounds(d.x, d.y, bounds)) return;
      const r = nodeRadius(d);
      ctx.fillText(d.id, d.x, d.y + r + 4 / transform.k);
    });
  }

  // ── Draw link labels on hover (only for highlighted node's connections) ──
  if (isHighlighting && zoomLevel > 0.8) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fontSize = Math.max(7, 9 / transform.k);
    ctx.font = `400 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
    ctx.fillStyle = 'rgba(58,223,250,0.6)';
    ctx.globalAlpha = 0.8;

    (adjacency[highlightedNode.id] || []).forEach(n => {
      const l = n.link;
      const mx = (l.source.x + l.target.x) / 2;
      const my = (l.source.y + l.target.y) / 2;
      if (inBounds(mx, my, bounds)) {
        ctx.fillText(l.relation, mx, my);
      }
    });
  }

  ctx.globalAlpha = 1.0;
  ctx.restore();
}

// ── Zoom (d3-zoom on canvas) ──
const zoomBehavior = d3.zoom()
  .scaleExtent([0.1, 8])
  .filter((event) => {
    if (event.type === 'mousedown') return !hitTest(event.clientX, event.clientY);
    return true;
  })
  .on('zoom', (event) => {
    transform = event.transform;
    scheduleRender();
  });

d3.select(canvas).call(zoomBehavior);
d3.select(canvas).call(zoomBehavior.transform, d3.zoomIdentity.translate(W / 2, H / 2));

// ── Hit testing (find node under mouse) ──
function hitTest(mx, my) {
  const world = screenToWorld(mx, my);
  let closest = null;
  let closestDist = Infinity;
  for (const d of DATA.nodes) {
    const dx = d.x - world.x;
    const dy = d.y - world.y;
    const dist = dx * dx + dy * dy;
    const r = nodeRadius(d) + 4;
    if (dist < r * r && dist < closestDist) {
      closest = d;
      closestDist = dist;
    }
  }
  return closest;
}

// ── Mouse interaction ──
let hoveredNode = null;
let dragNode = null;
let isDragging = false;

canvas.addEventListener('mousemove', (e) => {
  if (dragNode) return; // d3-drag handles this
  const node = hitTest(e.clientX, e.clientY);
  if (node !== hoveredNode) {
    hoveredNode = node;
    canvas.style.cursor = node ? 'pointer' : 'grab';
    if (!document.getElementById('info-panel').classList.contains('visible')) {
      setHighlight(node);
    }
  }
});

canvas.addEventListener('click', (e) => {
  if (isDragging) return;
  const node = hitTest(e.clientX, e.clientY);
  if (node) {
    showPanel(node);
    setHighlight(node);
  } else {
    closePanel();
    setHighlight(null);
  }
});

// ── Drag nodes (custom, integrated with d3-zoom) ──
canvas.addEventListener('mousedown', (e) => {
  const node = hitTest(e.clientX, e.clientY);
  if (node) {
    isDragging = false;
    dragNode = node;
    dragNode.fx = dragNode.x;
    dragNode.fy = dragNode.y;
    if (simulation.alpha() < 0.05) {
      simulation.alphaTarget(0.1).restart();
      simRunning = true;
    }
    e.preventDefault();
  }
});

window.addEventListener('mousemove', (e) => {
  if (!dragNode) return;
  isDragging = true;
  const world = screenToWorld(e.clientX, e.clientY);
  dragNode.fx = world.x;
  dragNode.fy = world.y;
});

window.addEventListener('mouseup', () => {
  if (dragNode) {
    dragNode.fx = null;
    dragNode.fy = null;
    if (isDragging) {
      simulation.alphaTarget(0).alpha(0.3).restart();
      simRunning = true;
    }
    dragNode = null;
    setTimeout(() => { isDragging = false; }, 50);
  }
});

// ── Panel functions ──
function showPanel(d) {
  const panel = document.getElementById('info-panel');
  const connected = adjacency[d.id] || [];

  const statusClass = 'status-' + (d.status || 'proposed');
  let html = `
    <div class="adr-id">${d.id}</div>
    <h2>${d.title}</h2>
    <div style="margin: 8px 0">
      <span class="status-badge ${statusClass}">${d.status}</span>
    </div>
    <div class="meta-row"><span class="meta-label">Date</span><span class="meta-value">${d.date}</span></div>
    <div class="meta-row"><span class="meta-label">Project</span><span class="meta-value">${d.project}</span></div>
    <div class="tags-row">${(d.tags || []).map(t =>
      '<span class="tag" style="border-left:2px solid ' + (tagColorMap[t] || '#7a7aff') + '">' + t + '</span>'
    ).join('')}</div>
  `;

  if (connected.length > 0) {
    html += '<div class="connections"><h3>Connections</h3>';
    connected.forEach(c => {
      const relColor = RELATION_COLORS[c.relation] || '#666';
      const arrow = c.dir === 'out' ? '&rarr;' : '&larr;';
      html += `<div class="conn-item" onclick="focusNode('${c.id}')">
        <span class="conn-rel" style="color:${relColor}">${c.relation} ${arrow}</span> ${c.id}
      </div>`;
    });
    html += '</div>';
  }

  document.getElementById('panel-content').innerHTML = html;
  panel.classList.add('visible');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('visible');
}

function focusNode(id) {
  const d = DATA.nodes.find(n => n.id === id);
  if (d) {
    showPanel(d);
    setHighlight(d);
  }
}

// Initial render
scheduleRender();
</script>
