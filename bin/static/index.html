<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Knowledge Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #060e20;
    color: #dee5ff;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #bg-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  #graph-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    cursor: grab;
  }
  #graph-canvas.dragging { cursor: grabbing; }

  .glass-dark {
    position: relative;
    border-radius: 1rem;
    background: rgba(15,25,48,0.05);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(3px);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow:
      inset 0 1px 2px 0 rgba(255,255,255,0.25),
      inset 1px 0 2px 0 rgba(255,255,255,0.15),
      inset 0 -1px 2px 0 rgba(0,0,0,0.35),
      inset -1px 0 2px 0 rgba(0,0,0,0.25),
      0 0 20px rgba(255,255,255,0.04),
      0 4px 6px -1px rgba(0,0,0,0.3),
      0 8px 20px -2px rgba(0,0,0,0.1),
      0 0 40px rgba(0,0,0,0.3);
  }
  .glass-dark::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none; z-index: 0;
    mask-image: linear-gradient(to right, black 0%, transparent 8%, transparent 92%, black 100%),
                linear-gradient(to bottom, black 0%, transparent 8%, transparent 92%, black 100%);
    mask-composite: add;
    -webkit-mask-image: linear-gradient(to right, black 0%, transparent 8%, transparent 92%, black 100%),
                        linear-gradient(to bottom, black 0%, transparent 8%, transparent 92%, black 100%);
    -webkit-mask-composite: source-over;
    backdrop-filter: blur(10px) brightness(1.8);
    -webkit-backdrop-filter: blur(10px) brightness(1.8);
  }
  .glass-dark::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none; z-index: 1;
    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.02) 1%, rgba(255,255,255,0.06) 8%,
        transparent 35%, transparent 88%, rgba(255,255,255,0.05) 100%),
      linear-gradient(to right, rgba(255,255,255,0.08) 0%, transparent 2%, transparent 97%, rgba(255,255,255,0.05) 100%),
      linear-gradient(to bottom, rgba(255,255,255,0.08) 0%, transparent 2%, transparent 97%, rgba(255,255,255,0.03) 100%);
  }
  .glass-dark > * { position: relative; z-index: 2; }

  #info-panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 340px;
    max-height: calc(100vh - 32px);
    padding: 24px;
    overflow-y: auto;
    display: none;
    z-index: 10;
  }
  #info-panel.visible { display: block; }
  #info-panel h2 {
    font-size: 15px;
    color: #dee5ff;
    margin-bottom: 4px;
    font-weight: 700;
  }
  #info-panel .adr-id {
    font-size: 11px;
    color: #3adffa;
    margin-bottom: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  #info-panel .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #info-panel .meta-label { color: rgba(222,229,255,0.4); }
  #info-panel .meta-value { color: #dee5ff; font-weight: 500; }
  #info-panel .tag {
    display: inline-block;
    background: rgba(58,223,250,0.08);
    color: #9bffce;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin: 2px 3px 2px 0;
  }
  #info-panel .tags-row { margin-top: 10px; }
  #info-panel .connections { margin-top: 14px; font-size: 12px; }
  #info-panel .connections h3 {
    font-size: 10px;
    color: #3adffa;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-weight: 700;
  }
  #info-panel .conn-item { padding: 3px 0; color: #dee5ff; cursor: pointer; }
  #info-panel .conn-item:hover { color: #3adffa; text-decoration: underline; }
  #info-panel .conn-rel { color: rgba(222,229,255,0.4); font-size: 10px; margin-right: 6px; }
  #info-panel .close-btn {
    position: absolute; top: 16px; right: 18px;
    background: none; border: none;
    color: rgba(222,229,255,0.4); font-size: 18px;
    cursor: pointer; line-height: 1; z-index: 3;
  }
  #info-panel .close-btn:hover { color: #3adffa; }

  .status-badge {
    display: inline-block; font-size: 10px;
    padding: 2px 8px; border-radius: 8px;
    font-weight: 600; letter-spacing: 0.3px;
  }
  .status-accepted { background: rgba(155,255,206,0.12); color: #9bffce; }
  .status-proposed { background: rgba(58,223,250,0.12); color: #3adffa; }
  .status-superseded { background: rgba(200,120,80,0.12); color: #c87850; }
  .status-deprecated { background: rgba(150,150,150,0.12); color: #999; }

  #legend {
    position: fixed;
    bottom: 16px;
    left: 16px;
    padding: 14px 18px;
    z-index: 10;
    font-size: 11px;
  }
  #legend h4 {
    font-size: 10px;
    color: #3adffa;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .legend-item {
    display: flex; align-items: center;
    gap: 8px; padding: 2px 0;
    color: rgba(222,229,255,0.6);
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 20px; height: 2px; flex-shrink: 0; border-radius: 1px; }

  #title {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    font-size: 13px;
    color: rgba(222,229,255,0.5);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  #title span { color: #3adffa; }
  #node-count {
    font-size: 11px;
    color: rgba(155,255,206,0.4);
    margin-top: 4px;
  }

  #search-box {
    position: fixed;
    top: 72px;
    left: 16px;
    z-index: 10;
  }
  #search-input {
    background: rgba(15,25,48,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #dee5ff;
    font-family: inherit;
    font-size: 12px;
    padding: 8px 12px;
    width: 220px;
    outline: none;
    backdrop-filter: blur(4px);
  }
  #search-input::placeholder { color: rgba(222,229,255,0.3); }
  #search-input:focus { border-color: #3adffa; }
  #search-count {
    font-size: 10px;
    color: rgba(155,255,206,0.5);
    margin-top: 4px;
    padding-left: 4px;
    min-height: 14px;
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="graph-canvas"></canvas>

<div id="title">
  <span>&#9670;</span> Decision Knowledge Graph
  <div id="node-count"></div>
</div>

<div id="search-box">
  <input id="search-input" type="text" placeholder="Search decisions..." />
  <div id="search-count"></div>
</div>

<div id="info-panel" class="glass-dark">
  <button class="close-btn" onclick="closePanel()">&times;</button>
  <div id="panel-content"></div>
</div>

<div id="legend" class="glass-dark">
  <h4>Relations</h4>
  <div class="legend-item"><div class="legend-line" style="background:#c87850"></div> supersedes</div>
  <div class="legend-item"><div class="legend-line" style="background:#3adffa"></div> informs</div>
  <div class="legend-item"><div class="legend-line" style="background:#9bffce"></div> related_to</div>
  <div class="legend-item"><div class="legend-line" style="background:#c180ff"></div> refines</div>
  <div class="legend-item"><div class="legend-line" style="background:#e05555"></div> contradicts</div>
</div>

<!-- Animated background -->
<script>
(function(){
  const cv = document.getElementById('bg-canvas');
  const cx = cv.getContext('2d');
  let W, H;

  const COLORS = [{r:58,g:223,b:250},{r:193,g:128,b:255},{r:155,g:255,b:206}];

  const orbs = [];
  for(let i=0;i<4;i++){
    orbs.push({
      x:Math.random(), y:Math.random(),
      vx:(Math.random()-0.5)*0.0003, vy:(Math.random()-0.5)*0.0003,
      rad:0.18+Math.random()*0.2,
      col:COLORS[i%COLORS.length],
      opacity:0.07+Math.random()*0.05,
    });
  }

  const N=45, pts=[];
  for(let i=0;i<N;i++){
    const col=COLORS[Math.floor(Math.random()*COLORS.length)];
    pts.push({
      x:Math.random(), y:Math.random(),
      vx:(Math.random()-0.5)*0.0004, vy:(Math.random()-0.5)*0.0004,
      col, size:0.3+Math.random()*2,
    });
  }

  const LINK_DIST=0.14;

  function resize(){
    const dpr=window.devicePixelRatio||1;
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize',resize);

  function frame(){
    cx.clearRect(0,0,W,H);
    orbs.forEach(o=>{
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-0.2||o.x>1.2) o.vx*=-1;
      if(o.y<-0.2||o.y>1.2) o.vy*=-1;
      const r=o.rad*Math.max(W,H);
      const g=cx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,r);
      g.addColorStop(0,`rgba(${o.col.r},${o.col.g},${o.col.b},${o.opacity})`);
      g.addColorStop(1,`rgba(${o.col.r},${o.col.g},${o.col.b},0)`);
      cx.fillStyle=g;
      cx.fillRect(o.x*W-r,o.y*H-r,r*2,r*2);
    });
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>1) p.vx*=-1;
      if(p.y<0||p.y>1) p.vy*=-1;
    });
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<LINK_DIST){
          const a=(1-d/LINK_DIST)*0.4;
          cx.strokeStyle=`rgba(${pts[i].col.r},${pts[i].col.g},${pts[i].col.b},${a})`;
          cx.lineWidth=0.5;
          cx.beginPath();
          cx.moveTo(pts[i].x*W,pts[i].y*H);
          cx.lineTo(pts[j].x*W,pts[j].y*H);
          cx.stroke();
        }
      }
    }
    pts.forEach(p=>{
      cx.beginPath();
      cx.arc(p.x*W,p.y*H,p.size,0,Math.PI*2);
      cx.fillStyle=`rgba(${p.col.r},${p.col.g},${p.col.b},0.3)`;
      cx.shadowColor=`rgba(${p.col.r},${p.col.g},${p.col.b},0.9)`;
      cx.shadowBlur=15;
      cx.fill();
      cx.shadowBlur=0;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

const RELATION_COLORS = {
  supersedes: '#c87850',
  related_to: '#9bffce',
  informs: '#3adffa',
  contradicts: '#e05555',
  refines: '#c180ff',
};

const STATUS_COLORS = {
  accepted: '#9bffce',
  proposed: '#3adffa',
  superseded: '#c87850',
  deprecated: '#666',
};

const TAG_PALETTE = [
  '#3adffa', '#c180ff', '#9bffce', '#ffa94d', '#ff7ab8',
  '#4dc9f6', '#a78bfa', '#50c878', '#f67019', '#acc236',
];

let nodes = [];
let links = [];
let tagColorMap = {};
let connectionCount = {};
let simulation;
let transform = d3.zoomIdentity;
let hoveredNode = null;
let selectedNode = null;
let draggedNode = null;
let searchHits = new Set();
let quadtree;

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', () => {
  resizeCanvas();
  draw();
});

function primaryTagColor(node) {
  if (node.tags && node.tags.length > 0) {
    return tagColorMap[node.tags[0]] || '#7a7aff';
  }
  return '#7a7aff';
}

function nodeRadius(d) {
  return 2.5 + (connectionCount[d.id] || 0) * 1;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function screenToWorld(event) {
  const rect = canvas.getBoundingClientRect();
  const sx = event.clientX - rect.left;
  const sy = event.clientY - rect.top;
  return [
    (sx - transform.x) / transform.k,
    (sy - transform.y) / transform.k,
  ];
}

function getConnected(d) {
  const set = new Set();
  set.add(d.id);
  links.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id) set.add(tid);
    if (tid === d.id) set.add(sid);
  });
  return set;
}

function drawArrow(ctx, x1, y1, x2, y2, r) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const tipX = x2 - Math.cos(angle) * (r + 2);
  const tipY = y2 - Math.sin(angle) * (r + 2);
  const size = 5;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - size * Math.cos(angle - 0.4), tipY - size * Math.sin(angle - 0.4));
  ctx.lineTo(tipX - size * Math.cos(angle + 0.4), tipY - size * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  const highlighted = hoveredNode || selectedNode;
  const connected = highlighted ? getConnected(highlighted) : null;

  // Links
  links.forEach(l => {
    const src = l.source;
    const tgt = l.target;
    if (src.x == null || tgt.x == null) return;

    const relColor = RELATION_COLORS[l.relation] || '#444';
    let alpha = 0.25;
    let width = 1;

    if (highlighted) {
      const sid = src.id;
      const tid = tgt.id;
      if (sid === highlighted.id || tid === highlighted.id) {
        alpha = 0.7;
        width = 2;
      } else {
        alpha = 0.05;
      }
    }

    if (searchHits.size > 0 && !highlighted) {
      const sid = src.id;
      const tid = tgt.id;
      alpha = (searchHits.has(sid) || searchHits.has(tid)) ? 0.4 : 0.03;
    }

    ctx.strokeStyle = relColor;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(src.x, src.y);
    ctx.lineTo(tgt.x, tgt.y);
    ctx.stroke();

    // Arrows for directed relations
    if (l.relation === 'supersedes' || l.relation === 'informs' || l.relation === 'refines') {
      ctx.fillStyle = relColor;
      drawArrow(ctx, src.x, src.y, tgt.x, tgt.y, nodeRadius(tgt));
    }

    ctx.globalAlpha = 1;
  });

  // Nodes
  nodes.forEach(d => {
    if (d.x == null) return;
    const r = nodeRadius(d);
    const color = primaryTagColor(d);
    const rgb = hexToRgb(color);

    let nodeAlpha = 0.85;
    let glowAlpha = 0.15;
    let showLabel = false;

    if (highlighted) {
      if (connected.has(d.id)) {
        nodeAlpha = 1;
        glowAlpha = 0.25;
        showLabel = true;
      } else {
        nodeAlpha = 0.15;
        glowAlpha = 0.03;
      }
    }

    if (searchHits.size > 0 && !highlighted) {
      if (searchHits.has(d.id)) {
        nodeAlpha = 1;
        glowAlpha = 0.35;
        showLabel = true;
      } else {
        nodeAlpha = 0.1;
        glowAlpha = 0.02;
      }
    }

    // Glow
    ctx.beginPath();
    ctx.arc(d.x, d.y, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${glowAlpha})`;
    ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${glowAlpha * 2})`;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Circle
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${nodeAlpha})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${nodeAlpha * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Label
    if (showLabel) {
      ctx.font = (d.id === (highlighted && highlighted.id) ? '600 ' : '') + '11px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = `rgba(222,229,255,0.9)`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.shadowColor = '#060e20';
      ctx.shadowBlur = 6;
      ctx.fillText(d.id, d.x, d.y + r + 4);
      ctx.shadowBlur = 0;
    }
  });

  // Link labels on hover
  if (highlighted) {
    ctx.font = '9px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    links.forEach(l => {
      const sid = l.source.id;
      const tid = l.target.id;
      if (sid === highlighted.id || tid === highlighted.id) {
        const mx = (l.source.x + l.target.x) / 2;
        const my = (l.source.y + l.target.y) / 2;
        ctx.fillStyle = 'rgba(58,223,250,0.6)';
        ctx.fillText(l.relation, mx, my);
      }
    });
  }

  ctx.restore();
}

// Zoom
const zoomBehavior = d3.zoom()
  .scaleExtent([0.2, 5])
  .on('zoom', (event) => {
    transform = event.transform;
    draw();
  });
d3.select(canvas).call(zoomBehavior);

// Center view initially
function centerView() {
  transform = d3.zoomIdentity.translate(W / 2, H / 2);
  d3.select(canvas).call(zoomBehavior.transform, transform);
}

// Hit detection
function findNode(event) {
  if (!quadtree) return null;
  const [mx, my] = screenToWorld(event);
  return quadtree.find(mx, my, 20 / transform.k);
}

// Mouse events
canvas.addEventListener('mousedown', (event) => {
  const node = findNode(event);
  if (node) {
    draggedNode = node;
    canvas.classList.add('dragging');
    simulation.alphaTarget(0.1).restart();
    draggedNode.fx = draggedNode.x;
    draggedNode.fy = draggedNode.y;
    event.stopPropagation();
  }
});

canvas.addEventListener('mousemove', (event) => {
  if (draggedNode) {
    const [mx, my] = screenToWorld(event);
    draggedNode.fx = mx;
    draggedNode.fy = my;
    return;
  }
  const node = findNode(event);
  if (node !== hoveredNode) {
    hoveredNode = node;
    canvas.style.cursor = node ? 'pointer' : 'grab';
    draw();
  }
});

canvas.addEventListener('mouseup', (event) => {
  if (draggedNode) {
    const wasDrag = draggedNode;
    simulation.alphaTarget(0);
    draggedNode.fx = null;
    draggedNode.fy = null;
    canvas.classList.remove('dragging');
    draggedNode = null;
    // If barely moved, treat as click
    return;
  }
});

canvas.addEventListener('click', (event) => {
  const node = findNode(event);
  if (node) {
    selectedNode = node;
    showPanel(node);
    draw();
  } else {
    selectedNode = null;
    closePanel();
    draw();
  }
});

// Panel
function showPanel(d) {
  const panel = document.getElementById('info-panel');
  const connected = [];
  links.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id) connected.push({ id: tid, relation: l.relation, dir: 'out' });
    if (tid === d.id) connected.push({ id: sid, relation: l.relation, dir: 'in' });
  });

  const statusClass = 'status-' + (d.status || 'proposed');
  let html = `
    <div class="adr-id">${d.id}</div>
    <h2>${escapeHtml(d.title)}</h2>
    <div style="margin: 8px 0">
      <span class="status-badge ${statusClass}">${d.status}</span>
    </div>
    <div class="meta-row"><span class="meta-label">Date</span><span class="meta-value">${d.date}</span></div>
    <div class="meta-row"><span class="meta-label">Project</span><span class="meta-value">${escapeHtml(d.project)}</span></div>
    <div class="tags-row">${(d.tags||[]).map(t =>
      '<span class="tag" style="border-left:2px solid '+(tagColorMap[t]||'#7a7aff')+'">'+escapeHtml(t)+'</span>'
    ).join('')}</div>
  `;

  if (connected.length > 0) {
    html += '<div class="connections"><h3>Connections</h3>';
    connected.forEach(c => {
      const relColor = RELATION_COLORS[c.relation] || '#666';
      const arrow = c.dir === 'out' ? '&rarr;' : '&larr;';
      html += `<div class="conn-item" onclick="focusNode('${c.id}')">
        <span class="conn-rel" style="color:${relColor}">${c.relation} ${arrow}</span> ${c.id}
      </div>`;
    });
    html += '</div>';
  }

  document.getElementById('panel-content').innerHTML = html;
  panel.classList.add('visible');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('visible');
  selectedNode = null;
}

function focusNode(id) {
  const d = nodes.find(n => n.id === id);
  if (d) {
    selectedNode = d;
    showPanel(d);
    draw();
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Search
const searchInput = document.getElementById('search-input');
const searchCount = document.getElementById('search-count');
let searchTimeout;

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if (!q) {
    searchHits = new Set();
    searchCount.textContent = '';
    draw();
    return;
  }
  searchTimeout = setTimeout(async () => {
    try {
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      searchHits = new Set(data.results.map(r => r.id));
      searchCount.textContent = data.count + ' match' + (data.count !== 1 ? 'es' : '');
      draw();
    } catch (err) {
      searchHits = new Set();
      searchCount.textContent = '';
      draw();
    }
  }, 300);
});

// Tag clustering
function tagCluster(alpha) {
  const centroids = {};
  const counts = {};
  nodes.forEach(d => {
    const tag = (d.tags && d.tags[0]) || '__none__';
    if (!centroids[tag]) { centroids[tag] = {x: 0, y: 0}; counts[tag] = 0; }
    centroids[tag].x += d.x || 0;
    centroids[tag].y += d.y || 0;
    counts[tag]++;
  });
  for (const tag in centroids) {
    centroids[tag].x /= counts[tag];
    centroids[tag].y /= counts[tag];
  }
  const strength = 0.06 * alpha;
  nodes.forEach(d => {
    const tag = (d.tags && d.tags[0]) || '__none__';
    const c = centroids[tag];
    d.vx += (c.x - d.x) * strength;
    d.vy += (c.y - d.y) * strength;
  });
}

// Load data and start
async function loadGraph() {
  const [nodesRes, linksRes, statsRes] = await Promise.all([
    fetch('/api/nodes'),
    fetch('/api/links'),
    fetch('/api/stats'),
  ]);
  const nodesData = await nodesRes.json();
  const linksData = await linksRes.json();
  const statsData = await statsRes.json();

  nodes = nodesData.nodes;
  links = linksData.links;

  // Build tag color map
  const allTags = new Set();
  nodes.forEach(n => (n.tags || []).forEach(t => allTags.add(t)));
  const sortedTags = [...allTags].sort();
  sortedTags.forEach((tag, i) => {
    tagColorMap[tag] = TAG_PALETTE[i % TAG_PALETTE.length];
  });

  // Connection counts
  connectionCount = {};
  nodes.forEach(n => connectionCount[n.id] = 0);
  links.forEach(l => {
    const src = typeof l.source === 'object' ? l.source.id : l.source;
    const dst = typeof l.target === 'object' ? l.target.id : l.target;
    connectionCount[src] = (connectionCount[src] || 0) + 1;
    connectionCount[dst] = (connectionCount[dst] || 0) + 1;
  });

  document.getElementById('node-count').textContent =
    statsData.nodes + ' decisions · ' + statsData.links + ' connections';

  // Force simulation
  const nodeCount = nodes.length;
  const baseRadius = Math.max(80, Math.sqrt(nodeCount) * 22);

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(45).strength(0.9))
    .force('charge', d3.forceManyBody().strength(-80).distanceMax(baseRadius * 2))
    .force('center', d3.forceCenter(0, 0).strength(0.3))
    .force('radial', d3.forceRadial(baseRadius * 0.6, 0, 0).strength(0.15))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 3).strength(0.7))
    .force('tagCluster', tagCluster)
    .alphaDecay(0.008)
    .velocityDecay(0.4);

  simulation.on('tick', () => {
    quadtree = d3.quadtree()
      .x(d => d.x)
      .y(d => d.y)
      .addAll(nodes);
    draw();
  });

  centerView();
}

loadGraph();
</script>
